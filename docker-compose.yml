services:
  backend:
    build: .
    container_name: nexus_backend
    ports:
      - "3000:3000"
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

  mongo1:
    image: mongo:8
    container_name: mongo1
    command: ["mongod", "--replSet", "rsBanco", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:8
    container_name: mongo2
    command: ["mongod", "--replSet", "rsBanco", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:8
    container_name: mongo3
    command: ["mongod", "--replSet", "rsBanco", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
